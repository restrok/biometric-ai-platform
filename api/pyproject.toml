[project]
name = "api"
version = "0.5.2"
description = "Biometric AI Platform API"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "db-dtypes>=1.5.1",
    "fastapi>=0.136.0",
    "google-cloud-bigquery>=3.41.0",
    "google-cloud-bigquery-storage>=2.27.0",
    "pandas-gbq>=0.26.1",
    "google-cloud-storage>=2.19.0",
    "langchain>=1.2.15",
    "langchain-google-genai>=4.2.2",
    "langgraph>=1.1.8",
    "pandas>=2.3.3",
    "pyarrow>=23.0.1",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.44.0",
    "langchain-community>=0.2.0",
    "ragas>=0.2.0",
    "garmin-training-toolkit-sdk @ git+https://github.com/restrok/garmin-training-toolkit-sdk.git@v0.8.0#subdirectory=garmin_toolkit",
    "fitbit-training-toolkit-sdk @ git+https://github.com/restrok/fitbit-training-toolkit-sdk.git@v0.2.0",
    "google-cloud-secret-manager>=2.27.0",
    "google-cloud-firestore>=2.21.0",
    "langfuse>=2.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-gcp-trace>=1.12.0",
    "duckdb>=1.5.5",
    "fastembed>=0.8.0",
    "mcp>=2.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.6",
    "mypy>=1.15.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "types-requests>=2.33.0.20260513",
    "pre-commit>=3.7.0",
    "pip-audit>=2.7.0",
]
lint = [
    "mypy>=1.15.0",
    "ruff>=0.9.6",
    "types-requests>=2.33.0.20260513",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (SAST)
]
ignore = [
    "B008",   # Allow FastAPI Depends
    "E402",   # Module level import not at top of file
    "E501",   # Line too long (managed by formatter)
    "B904",   # Allow raise HTTPException without from e
    "SIM102", # Allow nested if
    "SIM108", # Allow if-else instead of ternary
    "S104",   # Allow binding to 0.0.0.0 for containerized services
    "S608",   # Allow f-string BigQuery table/dataset identifier interpolation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"**/tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S101", "S105", "S106", "T201"]
"**/scripts/*" = ["S101", "S105", "S106", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
addopts = "-n auto --dist loadfile --cov=src --cov-report=term-missing"
